<div class="app-container">
  <header class="app-header">
    <nav class="nav-menu">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <i class="fas fa-home"></i> Home
      </a>
      <a *ngIf="userService.getCurrentUser()" routerLink="/dashboard" routerLinkActive="active">
        <i class="fas fa-tachometer-alt"></i> Dashboard
      </a>
      <a *ngIf="!userService.getCurrentUser()" routerLink="/login" routerLinkActive="active">
        <i class="fas fa-sign-in-alt"></i> Login
      </a>
      <div class="nav-spacer"></div>
      <button *ngIf="userService.getCurrentUser()" (click)="logout()" class="logout-btn">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </nav>
  </header>

  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
</div>
